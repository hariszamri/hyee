<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Surprise Untuk Awak</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Varela+Round&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #ff4d8d;
            --bg: #ffffff;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%;
            font-family: 'Varela Round', sans-serif;
            background-color: var(--bg);
            display: flex; 
            align-items: center; 
            justify-content: center;
            overflow: hidden; 
            transition: background 0.5s ease;
            cursor: default;
        }

        /* Modal Awal (Gatekeeper) */
        #gatekeeper {
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%;
            background: white; 
            z-index: 2000;
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
        }

        #gatekeeper h2 {
            color: #555;
            margin-bottom: 25px;
        }

        #gatekeeper button {
            background: var(--primary); 
            color: white; 
            border: none;
            padding: 15px 45px; 
            border-radius: 50px; 
            font-size: 1.1rem;
            cursor: pointer; 
            box-shadow: 0 4px 15px rgba(255,77,141,0.3);
            font-family: 'Varela Round', sans-serif;
            transition: transform 0.2s;
        }

        #gatekeeper button:active {
            transform: scale(0.95);
        }

        /* Kandungan Utama */
        #content { 
            display: none; 
            flex-direction: column; 
            align-items: center; 
            width: 100%; 
            padding: 20px; 
            z-index: 10; 
        }

        img { 
            width: 220px; 
            border-radius: 20px; 
            margin-bottom: 25px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.05); 
            transition: opacity 0.3s ease;
        }

        h1 { 
            color: #333; 
            font-size: 1.6rem; 
            text-align: center; 
            margin-bottom: 40px; 
            min-height: 1.5em; 
        }

        .btns { 
            position: relative; 
            display: flex; 
            gap: 20px; 
            align-items: center; 
            justify-content: center; 
            width: 100%; 
        }

        button.btn {
            border: none; 
            border-radius: 50px; 
            font-family: 'Varela Round', sans-serif;
            font-weight: bold; 
            cursor: pointer; 
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #yes { 
            background: var(--primary); 
            color: white; 
            padding: 15px 35px; 
            font-size: 1.2rem; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            z-index: 100;
        }
        
        #no { 
            background: #e0e0e0; 
            color: #777; 
            padding: 15px 35px; 
            font-size: 1rem; 
            position: relative;
        }

        /* Animasi Berdenyut (Pulse) untuk butang YES */
        @keyframes pulse { 
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255,77,141,0.5); }
            50% { transform: scale(1.05); box-shadow: 0 0 0 15px rgba(255,77,141,0); }
            100% { transform: scale(1); }
        }

        /* Animasi Hati Terapung */
        .heart-particle {
            position: absolute; 
            color: var(--primary); 
            pointer-events: none;
            animation: fly 3s linear forwards; 
            z-index: 5;
        }

        @keyframes fly {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <audio id="audio" loop>
        <source src="MASUKKAN_LINK_LAGU_KAU_KAT_SINI.mp3" type="audio/mpeg">
    </audio>

    <div id="gatekeeper">
        <h2>Sila jawab soalan nii</h2>
        <button onclick="start()">Okey</button>
    </div>

    <div id="content">
        <img id="gif" src="https://media4.giphy.com/media/v1.Y2lkPTc5MGI3NjExdXRtbGc3M3dlb3o0MTJoNmo4Z2Nna3NzbHJtM3F0Y3VreHg1MjJ0cSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/3HUa3QrYvl6Ch6eG6F/giphy.gif" alt="Cute Duck">
        
        <h1 id="headline">kamu rindu aku ga?</h1>
        
        <div class="btns">
            <button id="yes" class="btn" onclick="finish()">Mestilah</button>
            <button id="no" class="btn" onclick="moveNo()">Tak kot</button>
        </div>
    </div>

    <script>
        let clicks = 0;
        
        // Senarai ayat merajuk bila dia tekan NO
        const phrases = [
            "Eh, serius ke?", 
            "Sampai hati...", 
            "Sikit pun tak rindu?", 
            "Cepat tekan Mestilah!", 
            "Tengok butang tu, dah membesar"
        ];

        function start() {
            document.getElementById('gatekeeper').style.display = 'none';
            document.getElementById('content').style.display = 'flex';
            document.getElementById('audio').play().catch(() => console.log("Audio perlukan interaksi"));
        }

        function moveNo() {
            clicks++;
            const yes = document.getElementById('yes');
            const no = document.getElementById('no');
            const gif = document.getElementById('gif');

            // 1. Logik YES membesar & berdenyut
            let scale = 1 + (clicks * 0.6);
            yes.style.transform = `scale(${scale})`;
            yes.style.animation = "pulse 0.8s infinite";
            
            // 2. Logik NO melompat rawak dalam skrin
            const x = Math.random() * (window.innerWidth - 150);
            const y = Math.random() * (window.innerHeight - 150);
            no.style.position = 'fixed';
            no.style.left = x + 'px';
            no.style.top = y + 'px';
            
            // 3. Tukar teks NO
            no.innerText = phrases[Math.min(clicks - 1, phrases.length - 1)];

            // 4. Tukar GIF ke Itik Marah
            gif.src = "https://media1.giphy.com/media/v1.Y2lkPTc5MGI3NjExdGthdDNyZWNieWVuams5M2JhcHU0ZDV2MmhrYWk1czdldDliczluNyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/lR3pWtb80Hz22UjrYj/giphy.gif";
            
            // 5. Efek latar belakang makin malap
            document.body.style.background = `rgba(0,0,0,${Math.min(clicks * 0.08, 0.4)})`;

            // 6. Getaran untuk iPhone/Android
            if(navigator.vibrate) navigator.vibrate(50);
        }

        function finish() {
            const h1 = document.getElementById('headline');
            
            // Sembunyikan butang
            document.querySelector('.btns').style.display = 'none';
            
            // Tukar ke GIF Spin Happy
            document.getElementById('gif').src = "https://media1.giphy.com/media/v1.Y2lkPTc5MGI3NjExbWI0a3dmNGdldHFveWZxcGZtcGJteHlseXM2b2p0dnJreDdqdGdhMSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/5svKO0Imc6TajSZ1Ro/giphy.gif";
            
            // Kembalikan latar belakang ke putih bersih
            document.body.style.background = "white";

            // Kesan Menaip (Typing Effect)
            const msg = "yeayyy dh ckap dahhh mesti rindu aku";
            h1.innerText = "";
            let i = 0;
            function type() {
                if(i < msg.length) { 
                    h1.innerText += msg.charAt(i); 
                    i++; 
                    setTimeout(type, 70); 
                }
            }
            type();

            // Mula keluarkan hati terapung
            setInterval(spawnHeart, 300);
        }

        function spawnHeart() {
            const h = document.createElement('div');
            h.className = 'heart-particle';
            h.innerHTML = "❤"; // Simbol teks biasa, bukan emotikon
            h.style.left = Math.random() * 100 + "vw";
            h.style.fontSize = (20 + Math.random() * 20) + "px";
            h.style.animationDuration = (2 + Math.random() * 3) + "s";
            document.body.appendChild(h);
            
            // Buang elemen hati selepas animasi tamat supaya browser tak lag
            setTimeout(() => h.remove(), 4000);
        }
    </script>
</body>
</html>
